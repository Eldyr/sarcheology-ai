# SARchaeology AI configuration placeholder

sar:
  source: "sentinel-1-rtc"

  # RTC measurements are linear gamma-nought power.
  input_units: "gamma0_linear"

  # Keep the original power measurements.
  save_linear: true

  # Create a separate dB GeoTIFF.
  save_db: true

  # The source collection uses -32768 as nodata.
  source_nodata: -32768.0
  output_nodata: -9999.0

  # Resample continuous power measurements, not dB.
  resampling: "bilinear"

  # The two polarizations must be valid together.
  require_both_polarizations: true

  # Do not apply additional speckle filtering yet.
  speckle_filter: false

  output_directory: "data/processed/sar"
  preview_directory: "outputs/visualizations/sar"

optical:
  source: "sentinel-2-l2a"

  bands:
    - B02
    - B03
    - B04
    - B08
    - B11
    - B12

  quality_band: SCL

  # SCL classes to exclude:
  # 0  = No data
  # 1  = Saturated / defective
  # 2  = Topographic shadows
  # 3  = Cloud shadows
  # 7  = Unclassified
  # 8  = Medium-probability clouds
  # 9  = High-probability clouds
  # 10 = Thin cirrus
  # 11 = Snow / ice
  invalid_scl_classes: [0, 1, 2, 3, 7, 8, 9, 10, 11]

  cloud_buffer_pixels: 1
  minimum_scene_valid_fraction: 0.15
  minimum_composite_observations: 2

  output_nodata: -9999.0

  output_directory: "data/processed/optical"
  preview_directory: "outputs/visualizations/optical"
