# SARchaeology AI configuration placeholder

sar:
  source: "sentinel-1-rtc"

  # RTC measurements are linear gamma-nought power.
  input_units: "gamma0_linear"

  # Keep the original power measurements.
  save_linear: true

  # Create a separate dB GeoTIFF.
  save_db: true

  # The source collection uses -32768 as nodata.
  source_nodata: -32768.0
  output_nodata: -9999.0

  # Resample continuous power measurements, not dB.
  resampling: "bilinear"

  # The two polarizations must be valid together.
  require_both_polarizations: true

  # Do not apply additional speckle filtering yet.
  speckle_filter: false

  output_directory: "data/processed/sar"
  preview_directory: "outputs/visualizations/sar"

optical:
  source: "sentinel-2-l2a"

  bands:
    - B02
    - B03
    - B04
    - B08
    - B11
    - B12

  quality_band: SCL

  # SCL classes to exclude:
  # 0  = No data
  # 1  = Saturated / defective
  # 2  = Topographic shadows
  # 3  = Cloud shadows
  # 7  = Unclassified
  # 8  = Medium-probability clouds
  # 9  = High-probability clouds
  # 10 = Thin cirrus
  # 11 = Snow / ice
  invalid_scl_classes: [0, 1, 2, 3, 7, 8, 9, 10, 11]

  cloud_buffer_pixels: 1
  minimum_scene_valid_fraction: 0.15
  minimum_composite_observations: 2

  output_nodata: -9999.0

  output_directory: "data/processed/optical"
  preview_directory: "outputs/visualizations/optical"

dem:
  source: "cop-dem-glo-30"
  asset_key: "data"

  # Perform calculations at approximately
  # the native DEM spatial resolution.
  processing_resolution_m: 30

  # Extra terrain around the AOI prevents
  # edge artifacts in slope and TPI calculations.
  context_buffer_m: 900

  smoothing_sigma_pixels: 1.0
  tpi_sigma_pixels: 10.0

  # Match Sentinel-1 / Sentinel-2 grid later.
  output_nodata: -9999.0

  output_directory: "data/processed/terrain"
  preview_directory: "outputs/visualizations/terrain"

features:
  output_directory: "data/processed/features"
  output_nodata: -9999.0

  sar:
    min_valid_acquisitions: 3

  optical:
    min_valid_quarters: 2
    min_scene_observations_per_quarter: 2

alignment:
  year: 2024

  reference:
    # Read CRS and resolution from configs/data.yaml.
    source: "study_area"

  output_directory: "data/processed/aligned"
  output_nodata: -9999.0

  quality:
    min_sar_acquisitions: 3
    min_optical_quarters: 2

  resampling:
    continuous_features: "bilinear"
    masks_and_counts: "nearest"

  # Fail rather than producing a dataset with
  # no pixels valid across all three modalities.
  require_joint_coverage: true

patch_extraction:
  year: 2024

  # Outputs remain unassigned until Step 1.9.
  output_directory: "data/patches/unassigned"

  # Store the original modality inputs alongside
  # the 19 engineered feature channels.
  include_sar_time_series: true
  include_optical_quarters: true

  compression: "npz_compressed"
