# SARchaeology AI configuration placeholder

project:
  name: "SARchaeology AI"
  dataset_version: "1.0"

study_area:
  id: "buto_demo"
  geojson: "configs/aois/buto_demo.geojson"

  # UTM zone 36 North, appropriate for this area.
  target_crs: "EPSG:32636"
  resolution_m: 10

time_range:
  start: "2024-01-01"
  end: "2024-12-31"

satellite_sources:
  stac_url: "https://planetarycomputer.microsoft.com/api/stac/v1"

  sentinel1:
    collection: "sentinel-1-rtc"
    polarizations:
      - VV
      - VH
    instrument_mode: "IW"
    max_items: 300

  sentinel2:
    collection: "sentinel-2-l2a"
    max_cloud_cover: 40
    max_items: 300
    bands:
      - B02
      - B03
      - B04
      - B08
      - B11
      - B12
      - SCL

  dem:
    collection: "cop-dem-glo-30"
    max_items: 30

patches:
  size: 128
  stride: 64
  minimum_valid_fraction: 0.85

paths:
  scene_metadata: "data/metadata/scenes"
  manifests: "data/metadata/manifests"
  processed: "data/processed"
  patches: "data/patches"
