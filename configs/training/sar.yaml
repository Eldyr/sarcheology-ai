dataset:
  dataset_id: "buto_demo_2024"

  manifest_directory: "data/metadata/manifests/splits"
  patch_directory: "data/patches/unassigned"

  # Minimum valid VV/VH coverage for an individual
  # SAR acquisition inside a geographic patch.
  min_valid_fraction: 0.85

  # Maximum number of decompressed SAR time series
  # held in memory by each Dataset instance.
  cache_size: 2

dataloader:
  batch_size: 16

  # Begin with zero workers for easier debugging
  # and reliable Windows execution.
  num_workers: 0

  pin_memory: true
  persistent_workers: false

  shuffle_train: true
  drop_last_train: false


training:
  seed: 42
  device: "cuda"
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  mixed_precision: true
  amp_dtype: "float16"
  deterministic: true
  optimizer: "adamw"
  scheduler: "cosine"
  min_learning_rate: 0.000001
  log_every_batches: 50

experiment:
  project: "sarchaeology_ai"
  model_name: "sar_cae"
  output_directory: "outputs/experiments/sar"
  checkpoint_directory: "checkpoints/sar"


experiment:
  project: "sarchaeology_ai"
  model_name: "sar_cae"
  output_directory: "outputs/experiments/sar"
  checkpoint_directory: "checkpoints/sar"

normalization:
  method: "robust_iqr"
  output_path: "outputs/statistics/sar_normalization.json"

  # Deterministic sampling from valid pixels
  # of each eligible training observation.
  pixels_per_acquisition: 128
  seed: 42

  # Same threshold as the SAR Dataset.
  min_valid_fraction: 0.85

  # Avoid division by near-zero scale.
  min_scale: 0.01

  # Standardized outlier clipping.
  clip_min: -5.0
  clip_max: 5.0

model:
  architecture: "sar_cae"
  in_channels: 2
  base_channels: 32
  latent_channels: 128
  embedding_dim: 128
  group_norm_groups: 8
  input_size: 128

loss:
  type: "huber"
  huber_delta: 1.0
  reduction: "mean"
  channel_weights: [1.0, 1.0]
