experiment:
  name: optical_swin_tiny_mim
  dataset_id: buto_demo_2024
  output_dir: outputs/training/optical_swin_mim
  checkpoint_dir: checkpoints/optical_swin_mim
data:
  statistics_path: outputs/statistics/optical_buto_multiyear_v1.json
  min_valid_fraction: 0.5
  batch_size: 8
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
model:
  image_size: 128
  patch_size: 8
  in_channels: 6
  mask_ratio: 0.75
  embed_dim: 96
  depths:
  - 2
  - 2
  - 6
  - 2
  heads:
  - 3
  - 6
  - 12
  - 24
  window_size: 8
  decoder_dim: 128
training:
  seed: 42
  epochs: 100
  learning_rate: 0.0001
  min_learning_rate: 1.0e-06
  weight_decay: 0.05
  gradient_clip_norm: 1.0
  precision: bf16
  huber_delta: 1.0
  log_every_batches: 50
multiyear:
  years:
  - 2022
  - 2023
  - 2024
  - 2025
  patience: 20
  min_valid_fraction: 0.5
  min_source_observations: 1
